# 저장소 안 경로: .github/workflows/refresh.yml
# 3시간마다(한국시간 00:17, 03:17, 06:17 … 21:17) 예보를 새로 받아 사이트에 배포해요.
# 파일을 올리거나 고칠 때(push)도 새 예보를 받아 바로 다시 배포해요.
# 예보 데이터는 배포본에만 넣고 저장소에는 저장하지 않아요(저장소 용량이 계속 커지지 않게).
name: 예보 자동 갱신

on:
  schedule:
    - cron: "17 */3 * * *"   # UTC 기준 3시간마다 = 한국시간 00:17, 03:17, 06:17 …
  workflow_dispatch:          # Actions 탭에서 'Run workflow'로 직접 실행
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 예보 받아서 index.html 갱신
        continue-on-error: true   # 예보 서버가 잠깐 안 되면 기존 데이터로라도 배포
        run: python3 refresh.py index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - id: deploy
        uses: actions/deploy-pages@v4
